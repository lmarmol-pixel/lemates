  const key=s+(s==='play'?S.view:'');
  if(key!==lastScreen){lastScreen=key;window.scrollTo(0,0);if(s==='bracket'){const c=app.querySelector('[data-cur]');if(c&&c.scrollIntoView){c.scrollIntoView({block:'center',inline:'center'});
    /* deja a la vista la ronda anterior completa, para ver de dónde viene cada jugador */
    const k=c.closest('.bk.tree'),cell=c.closest('.bs');
    if(k&&cell&&k.scrollWidth>k.clientWidth){const step=cell.offsetWidth+parseFloat(getComputedStyle(k).getPropertyValue('--g')||0);k.scrollLeft=Math.max(0,cell.offsetLeft-step-16)}}}}
  if(s==='lock'||s==='edit'){const f=$('#pw')||$('#rost');if(f)f.focus()}
  const finished=(s==='play'&&S.view==='play'&&G&&G.phase==='end'&&(G.kind!=='boss'||G.won))||(s==='bracket'&&TR&&TR.cur===null);
  if(NAVIDAD)document.body.classList.toggle('nv-snow',s==='home'||!!finished);
  if(finished)confetti();
  try{MUS.sync()}catch(e){}
}
function leave(){
  clearLater();timerStop();bossStop();
  if(S.screen==='duel'||S.screen==='bracket')saveTour();
  G=null;D=null;S.t0=0;S.view='play';S.fromDuel=false;S.confirmBack=false;S.sel=null;S.csv='';S.copied=false;S.sumTxt='';S.heatSt='';
}
function openSetup(c){S.course=c;S.teams=null;S.screen='setup';render()}
function resetTeams(list){if(S.teams)S.teams=dealAuto(S.cfg.tmode==='teams'||S.cfg.mode==='teams'?Math.min(S.cfg.teamsN,list.length):2,list)}

/* ================= acciones ================= */
function act(a,d){
  const c=S.course,list=c?presentOf(c):[];
  switch(a){
    case 'home':leave();S.screen='home';render();break;
    case 'open-class':{
      const id=d.id,cur=DB.classes[id];S.lockId=id;S.msg='';
      if(cur&&cur.enc){if(unlocked.has(id)&&cur.names.length>=2)return openSetup(CLASSES.find(x=>x.id===id));S.screen='lock'}
      else if(!cur||!cur.hash){if(cur&&cur.names&&cur.names.length>=2)return openSetup(CLASSES.find(x=>x.id===id));S.screen='edit'}
      else if(unlocked.has(id))return openSetup(CLASSES.find(x=>x.id===id));
      else S.screen='lock';
      render();break;
    }
    case 'unlock':{
      const cl=CLASSES.find(x=>x.id===S.lockId),cur=DB.classes[cl.id],pw=$('#pw').value;
      const bad=m=>{S.msg=m||'Contraseña incorrecta.';const e=$('#pwerr');if(e)e.textContent=S.msg;const f=$('#pw');if(f){f.value='';f.focus()}};
      if(cur.enc){
        if(!(window.crypto&&crypto.subtle))return bad('Este navegador no puede abrir la lista. Usa Chrome o la app de Claude.');
        openRoster(cl.id,pw).then(names=>{
          if(names&&names.length>=2){cur.names=names;ROSTER_OPEN[cl.id]=names;ENC_PW[cl.id]=pw;unlocked.add(cl.id);openSetup(cl)}
          else bad();
        });
        break;
      }
      sha((cur.salt||'')+pw).then(h=>{
        if(h===cur.hash){unlocked.add(cl.id);if(ROSTER_ENC[cl.id]&&window.crypto&&crypto.subtle)openRoster(cl.id,pw).then(n=>{if(n)ROSTER_OPEN[cl.id]=n});openSetup(cl)}
        else bad();
      });
      break;
    }
    case 'restore-roster':{const r=ROSTER_OPEN[S.lockId],t=$('#rost');if(r&&t)t.value=r.join('\n');break}
    case 'edit-class':S.lockId=c.id;S.msg='';S.screen='edit';render();break;
    case 'to-setup':
      if(S.screen==='edit'){openSetup(CLASSES.find(x=>x.id===S.lockId))}
      else{leave();S.screen='setup';S.teams=null;render()}
      break;
    case 'save-class':{
      const id=S.lockId,cur=DB.classes[id],names=parseNames($('#rost').value),pw=$('#pwn').value,err=m=>{S.msg=m;const e=$('#pwerr');if(e)e.textContent=m};
      if(names.length<2)return err('Escribe al menos dos nombres.');
      const skip=!!(cur&&cur.names&&cur.names.length&&!cur.hash);
      if(!skip&&(!cur||!cur.hash)&&pw.length<4)return err('Crea una contraseña de al menos 4 caracteres.');
      if(pw&&pw.length<4)return err('La contraseña necesita al menos 4 caracteres'+(skip?', o déjala vacía.':'.'));
      const use=pw||(cur&&cur.enc?ENC_PW[id]||'':'');
      const salt=(cur&&cur.salt)||Math.random().toString(36).slice(2);
      const fin=h=>{DB.classes[id]={names,salt,hash:h};save();unlocked.add(id);if(use)ENC_PW[id]=use;openSetup(CLASSES.find(x=>x.id===id))};
      if(use)sha(salt+use).then(fin);else fin((cur&&cur.hash)||'');
      break;
    }
    case 'libre-start':if(parseNames(DB.libre).length)openSetup(LIBRE);break;
    case 'tbl':{const n=+d.n,t=DB.prefs.tables,i=t.indexOf(n);if(i>=0)t.splice(i,1);else{t.push(n);t.sort((x,y)=>x-y)}save();render();break}
    case 'tbl-all':DB.prefs.tables=TABLES.slice();save();render();break;
    case 'tbl-none':DB.prefs.tables=[];save();render();break;
    case 'mode':S.cfg.mode=d.m;S.teams=null;if(d.m==='boss')bossRig();render();break;
    case 'tmode':S.cfg.tmode=d.m;S.teams=null;render();break;
    case 'bmode':S.cfg.bmode=d.m;S.teams=null;render();break;
    case 'bdiff':S.cfg.bdiff=d.v;render();break;
    case 'secs':DB.prefs.secs=+d.s;save();render();break;
    case 'op':DB.prefs.op=d.v;save();render();break;
    case 'imp':S.impDays=+d.v||7;render();break;
    case 'max':DB.prefs.max=+d.v;save();render();break;
    case 'best':S.cfg[d.k]=+d.v;render();break;
    case 'teamsN':S.cfg.teamsN=+d.n;if(S.teams)S.teams=dealAuto(S.cfg.teamsN,list);render();break;
    case 'rounds':S.cfg.rounds=+d.n;render();break;
    case 'deal':S.teams=dealAuto(Math.min(S.cfg.teamsN,list.length),list);render();break;
    case 'deal-rnd':S.teams=dealTeams(Math.min(S.cfg.teamsN,list.length),list);render();break;
    case 'start':
      if(!canStart(list))return;
      if(S.cfg.mode==='individual')startIndividual();else if(S.cfg.mode==='teams')startTeams();else if(S.cfg.mode==='boss')startBoss();else startTour();
      break;
    case 'again-teams':clearLater();timerStop();bossStop();G=null;S.t0=0;S.screen='setup';render();break;
    case 'resume-tour':TR=JSON.parse(JSON.stringify(DB.tour[c.id]));S.repId=null;S.fromDuel=false;S.t0=0;S.screen='bracket';confettiDone=false;render();break;
    case 'discard-tour':delete DB.tour[c.id];save();render();break;
    case 'losers':S.cfg.losers=d.v==='1';render();break;
    case 'minus':duelMinus(d.side);break;
    case 'rep':{
      const id=+d.id;
      if(S.repId!==id){S.repId=id;render();later(()=>{if(S.repId===id){S.repId=null;if(S.screen==='bracket')render()}},4500);break}
      S.repId=null;repeatMatch(id);break;
    }
    case 'mute':DB.prefs.mute=!DB.prefs.mute;save();render();break;
    case 'music':DB.prefs.music=DB.prefs.music===false;save();render();break;
    case 'bien':if(G.kind==='ind')indMark(true);else if(G.kind==='boss')bossMark(true);else tmMark(true);break;
    case 'mal':if(G.kind==='ind')indMark(false);else if(G.kind==='boss')bossMark(false);else tmMark(false);break;
    case 'reveal':if(G.kind==='boss')bossReveal();else indReveal();break;
    case 'skip':if(G.kind==='ind')indSkip();else if(G.kind==='boss')bossSkip();else tmSkip();break;
    case 'pause':pauseToggle();break;
    case 'joker':tmJoker();break;
    case 'seguir':tmAfter();break;
    case 'undo':if(G.kind==='boss')bossUndo();else indUndo();break;
    case 'reset-hist':
      if(S.confirmReset){DB.hist[c.id]=[];DB.rep[c.id]=[];save();S.confirmReset=false;if(G)G.undo=null;render()}
      else{S.confirmReset=true;render();later(()=>{S.confirmReset=false;if(S.screen==='play'&&S.view==='play'&&G&&G.phase!=='count'){const b=document.querySelector('[data-act=reset-hist]');if(b)b.textContent='Reiniciar historial'}},3000)}
      break;
    case 'stats':
      if(G&&G.kind==='team'&&(G.phase==='count'||G.phase==='splash'))return;
      S.statsBack='play';if(G&&(G.phase==='ask')&&T.on)timerPause();
      S.view='stats';S.sel=null;S.csv='';S.copied=false;render();break;
    case 'stats-end':S.statsBack='setup';S.view='stats';S.sel=null;S.csv='';render();break;
    case 'back-play':
      S.view='play';S.csv='';
      if(G&&G.phase==='ask'&&!T.on&&T.left>0)timerResume();
      if(!G||S.statsBack==='setup'){leave();S.screen='setup';S.teams=null}
      render();break;
    case 'cell':S.sel=[+d.a,+d.b];render();break;
    case 'csv':{
      const txt=csvText(computeStats(c));S.csv=txt;S.copied=false;
      try{navigator.clipboard.writeText(txt).then(()=>{S.copied=true;render()},()=>{})}catch(e){}
      render();break;
    }
    case 'abs-open':S.absOpen=!S.absOpen;render();break;
    case 'abs':{const a=absOf(c);d.nm&&(a.has(d.nm)?a.delete(d.nm):a.add(d.nm));DB.abs[c.id]={d:today(),n:[...a]};save();S.teams=null;render();break}
    case 'abs-none':delete DB.abs[c.id];save();S.teams=null;render();break;
    case 'stats-setup':G=null;S.statsBack='setup';S.screen='play';S.view='stats';S.sel=null;S.csv='';S.copied=false;render();break;
    case 'hall':S.hallBack=S.screen==='bracket'?'bracket':'setup';S.screen='hall';S.confirmHall=false;render();break;
    case 'hall-back':S.confirmHall=false;S.screen=S.hallBack==='bracket'&&TR?'bracket':'setup';render();break;
    case 'hall-clear':
      if(S.confirmHall){delete DB.hall[c.id];save();S.confirmHall=false;render()}
      else{S.confirmHall=true;render();later(()=>{if(S.confirmHall){S.confirmHall=false;if(S.screen==='hall')render()}},3500)}
      break;
    case 'report':S.rpt={st:d.nm||null};S.sumTxt='';S.screen='report';render();break;
    case 'report-back':S.screen='play';S.sumTxt='';render();break;
    case 'print':try{window.print()}catch(e){}break;
    case 'copy-sum':{
      const txt=sumText(c,S.rpt&&S.rpt.st);S.sumTxt=txt;S.sumCopied=false;
      try{navigator.clipboard.writeText(txt).then(()=>{S.sumCopied=true;render()},()=>{})}catch(e){}
      render();break;
    }
    case 'backup':S.screen='backup';S.bk='';S.bkMsg='';S.bkErr='';S.bkOk='';S.confirmBk=false;render();break;
    case 'backup-back':S.screen='home';S.confirmBk=false;render();break;
    case 'bk-copy':
      packBackup().then(code=>{
        S.bk=code;S.bkMsg='Selecciona todo el código y cópialo.';S.bkOk='';S.bkErr='';render();
        try{navigator.clipboard.writeText(code).then(()=>{S.bkMsg='Copiado. Pégalo donde lo quieras guardar.';if(S.screen==='backup')render()},()=>{})}catch(e){}
      });break;
    case 'bk-restore':{
      const txt=S.bkIn||'';S.bkErr='';S.bkOk='';
      if(!txt.trim()){S.bkErr='Pega primero el código del respaldo.';render();break}
      if(!S.confirmBk){S.confirmBk=true;render();later(()=>{if(S.confirmBk){S.confirmBk=false;if(S.screen==='backup')render()}},4000);break}
      S.confirmBk=false;
      unpackBackup(txt).then(db=>{applyBackup(db);S.bkIn='';S.bk='';S.bkMsg='';S.bkOk='Listo: los datos se restauraron.';render()}).catch(()=>{S.bkErr='Ese código no es un respaldo válido.';render()});
      break;
    }
    case 'g-connect':GS.msg='';if(!GS.on)GS.st='busy';gUi();gRun(true,true);break;
    case 'g-now':gRun(false,true);break;
    case 'g-off':{const t=GS.tok;GS.on=false;GS.tok='';GS.exp=0;GS.st='off';GS.msg='';clearTimeout(GS.timer);gPersist();try{if(t)google.accounts.oauth2.revoke(t,()=>{})}catch(e){}gUi();break}
    case 'duel-play':startDuel();break;
    case 'pa':duelPoint('a');break;
    case 'pb':duelPoint('b');break;
    case 'pnone':duelNobody();break;
    case 'dreveal':duelReveal();break;
    case 'dpause':duelPause();break;
    case 'view-bracket':if(D&&D.phase==='count')break;timerPause();S.fromDuel=true;S.screen='bracket';render();break;
    case 'back-duel':S.fromDuel=false;S.screen='duel';if(D.phase==='ask'&&T.left>0)timerResume();render();break;
    case 'save-exit':saveTour();leave();S.screen='home';render();break;
    case 'back-setup':
      if(G&&(G.kind==='team'||G.kind==='boss')&&G.phase!=='end'&&!S.confirmBack){S.confirmBack=true;render();later(()=>{if(S.confirmBack){S.confirmBack=false;const b=document.querySelector('[data-act=back-setup]');if(b)b.textContent='← Volver'}},3000);break}
      S.confirmBack=false;leave();S.screen='setup';S.teams=null;render();break;
    case 'bracket-back':
      if(S.fromDuel){S.fromDuel=false;S.screen='duel';if(D&&D.phase==='ask'&&T.left>0)timerResume();render();break}
      saveTour();leave();S.screen='setup';S.teams=null;render();break;
  }
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  act(t.dataset.act,t.dataset);
});
app.addEventListener('input',e=>{
  if(e.target.id==='bkin')S.bkIn=e.target.value;
  if(e.target.id==='libre'){
    DB.libre=e.target.value;save();
    const b=document.getElementById('libreGo');if(b)b.disabled=!parseNames(DB.libre).length;
  }
});
app.addEventListener('change',e=>{
  const tg=e.target;
  if(tg.hasAttribute&&tg.hasAttribute('data-heat')){S.heatSt=tg.value;S.sel=null;render();return}
  if(tg.hasAttribute&&tg.hasAttribute('data-rpt')){S.rpt={st:tg.value||null};S.sumTxt='';render();return}
  const nm=e.target.getAttribute&&e.target.getAttribute('data-move');
  if(nm===null||nm===undefined||!S.teams)return;
  const to=+e.target.value;
  S.teams=S.teams.map(m=>m.filter(x=>x!==nm));S.teams[to].push(nm);render();
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='pw'){e.preventDefault();act('unlock',{})}
});
document.addEventListener('keydown',e=>{
  const tg=e.target;
  if(tg.closest&&tg.closest('input,textarea,select'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(tg.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  const k=e.key.toLowerCase();let used=true;
  if(S.screen==='play'&&S.view==='play'&&G&&(G.phase==='ask'||G.phase==='paused'||G.phase==='reveal')){
    if(G.phase==='reveal'&&G.rbDone){if(k==='enter'||k==='n'||k===' ')tmAfter();else used=false}
    else if(k==='b'||k==='enter')act('bien',{});
    else if(k==='m')act('mal',{});
    else if(k==='r'&&G.kind==='ind')indReveal();
    else if(k==='r'&&G.kind==='boss')bossReveal();
    else if(k==='n')act('skip',{});
    else if(k==='p'||k===' ')pauseToggle();
    else if(k==='c'&&G.kind==='team')tmJoker();
    else used=false;
  }else if(S.screen==='duel'&&D&&D.phase!=='count'){
    if(k==='1')duelPoint('a');else if(k==='2')duelPoint('b');else if(k==='0'||k==='n')duelNobody();
    else if(k==='r')duelReveal();else if(k==='p'||k===' ')duelPause();else used=false;
  }else used=false;
  if(used)e.preventDefault();
});

/* ================= arranque ================= */
const boot=()=>{nvBoot();render()};
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot();
})();
</script>
